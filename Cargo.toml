[package]
name = "rvllm"
version = "0.1.0"
edition = "2024"
default-run = "rvllm"
description = "Small LLM inference engine in Rust: paged KV cache, continuous batching, CPU and CUDA backends, GGUF loading"
license = "MIT"
repository = "https://github.com/ermolushka/rvllm"
readme = "README.md"
keywords = ["llm", "inference", "gguf", "cuda", "llama"]
categories = ["science", "command-line-utilities"]
exclude = [".github/", "tokenizer.json"]

[lib]
name = "rvllm"
path = "src/lib.rs"

[[bin]]
name = "rvllm"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
required-features = ["cli"]

[[example]]
name = "server"
required-features = ["server"]

[dependencies]
candle-core = "0.11.0"
candle-nn = "0.11.0"
tokenizers = "0.23.1"
kv-cache-scheduler = "0.2.0"
rand = "0.9"
cudarc = { version = "0.19.0", optional = true, features = ["cuda-13000", "f16"] }
half = { version = "2.7", optional = true }
clap = { version = "4.6.4", features = ["derive"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "net"], optional = true }
tokio-stream = { version = "0.1", optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
axum = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"], optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1

[features]
default = ["cli"]
cuda = ["dep:cudarc", "dep:half"]
server = ["dep:tokio", "dep:tokio-stream", "dep:futures-util", "dep:axum", "dep:serde", "dep:serde_json"]
tui = ["dep:ratatui"]
# Everything the `rvllm` and `bench` binaries need.
cli = ["server", "tui", "dep:clap"]
