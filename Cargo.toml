[package]
name = "rvllm"
version = "0.1.0"
edition = "2024"
default-run = "rvllm"

[lib]
name = "rvllm"
path = "src/lib.rs"

[[bin]]
name = "rvllm"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[dependencies]
candle-core = "0.11.0"
candle-nn = "0.11.0"
clap = { version = "4.6.4", features = ["derive"] }
tokenizers = "0.23.1"
kv-cache-scheduler = "0.2.0"
rand = "0.9"
cudarc = { version = "0.19.0", optional = true, features = ["cuda-13000", "f16"]}
half = { version = "2.7", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "net"] }
tokio-stream = "0.1"
futures-util = { version = "0.3", default-features = false }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1

[features]
cuda = ["dep:cudarc", "dep:half"]
